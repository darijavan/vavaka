name: vavaka
description: "Vavaka Bahá'í — Malagasy Bahá'í prayer app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  go_router: ^17.3.0
  shared_preferences: ^2.5.3
  share_plus: ^13.3.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - data/index.json
    - data/01-andro-manelanelana/prayers.json
    - data/02-ankizy/prayers.json
    - data/03-antenimiera-am-panahy/prayers.json
    - data/04-fahafatesana/prayers.json
    - data/05-fahamarinana/prayers.json
    - data/06-fahasitranana/prayers.json
    - data/07-famaranana-ny-fivoarian-ny-antenimiera-am-panahy/prayers.json
    - data/08-famelan-keloka/prayers.json
    - data/09-fampianarana/prayers.json
    - data/10-fanambadiana/prayers.json
    - data/11-fanampiana-sy-fanatrehana/prayers.json
    - data/12-fiarovana/prayers.json
    - data/13-fiderana-sy-fisaorana/prayers.json
    - data/14-fifadian-kanina/prayers.json
    - data/15-firaisankina/prayers.json
    - data/16-fivahinianana-masina/prayers.json
    - data/17-fivoriana/prayers.json
    - data/18-hariva/prayers.json
    - data/19-mangiran-dratsy/prayers.json
    - data/20-maraina/prayers.json
    - data/21-martiora/prayers.json
    - data/22-naw-ruz/prayers.json
    - data/23-sedra-sy-fahasahiranana/prayers.json
    - data/24-takelak-i-ahmad/prayers.json
    - data/25-takela-pahatsiarovana/prayers.json
    - data/26-toetra-ara-panahy/prayers.json
    - data/27-vavaka-fahasitranana-lava/prayers.json
    - data/28-vavaka-ho-an-ny-firenen-drehetra/prayers.json

  fonts:
    - family: Spectral
      fonts:
        - asset: assets/fonts/Spectral-Regular.ttf
        - asset: assets/fonts/Spectral-Italic.ttf
          style: italic
        - asset: assets/fonts/Spectral-Medium.ttf
          weight: 500
        - asset: assets/fonts/Spectral-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Spectral-SemiBoldItalic.ttf
          weight: 600
          style: italic
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf
        - asset: assets/fonts/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk-Bold.ttf
          weight: 700
