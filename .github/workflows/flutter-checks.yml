name: Flutter checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
